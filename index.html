<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="CISM Trainer">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg">
<title>CISM Trainer</title>
<style>html,body{margin:0;background:#07111f;color:#fff;font-family:Tahoma,Arial,sans-serif;min-height:100%}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.box{max-width:520px}.logo{width:84px;height:84px;margin:0 auto 18px;border-radius:22px;background:#53d769;color:#05210c;display:grid;place-items:center;font-weight:900;font-size:22px}.spin{width:38px;height:38px;border:4px solid #28415c;border-top-color:#53d769;border-radius:50%;margin:18px auto;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.muted{color:#9bb0c5;line-height:1.7}</style>
</head><body><div class="boot"><div class="box"><div class="logo">CISM</div><h2>جاري تشغيل محاكي CISM</h2><div class="spin"></div><div class="muted">يتم تحميل بنك الأسئلة محليًا داخل التطبيق. بعد أول تشغيل يمكنك إضافته إلى الشاشة الرئيسية في iPhone.</div></div></div>
<script>window.__CISM_PAYLOAD__=[];</script>
<script src="./payload-00.js"></script><script src="./payload-01.js"></script><script src="./payload-02.js"></script><script src="./payload-03.js"></script><script src="./payload-04.js"></script><script src="./payload-05.js"></script><script src="./payload-06.js"></script><script src="./payload-07.js"></script>
<script>
(async()=>{try{
 const b64=window.__CISM_PAYLOAD__.join(""); const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
 const ds=new DecompressionStream("gzip"); const text=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
 document.open();document.write(text);document.close();
}catch(e){document.body.innerHTML='<div class="boot"><div class="box"><h2>تعذر تشغيل التطبيق</h2><p class="muted">حدّث Safari إلى إصدار حديث ثم أعد فتح الصفحة.</p></div></div>';console.error(e)}})();
</script></body></html>
