<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="CISM Trainer">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg">
<title>CISM Trainer</title>
<style>html,body{margin:0;background:#07111f;color:#fff;font-family:Tahoma,Arial,sans-serif;min-height:100%}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.box{max-width:520px}.logo{width:84px;height:84px;margin:0 auto 18px;border-radius:22px;background:#53d769;color:#05210c;display:grid;place-items:center;font-weight:900;font-size:22px}.spin{width:38px;height:38px;border:4px solid #28415c;border-top-color:#53d769;border-radius:50%;margin:18px auto;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.muted{color:#9bb0c5;line-height:1.7}.err{background:#102033;border:1px solid #294765;border-radius:16px;padding:18px;margin-top:18px;text-align:right}</style>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
</head><body><div class="boot"><div class="box"><div class="logo">CISM</div><h2>جاري تشغيل محاكي CISM</h2><div class="spin"></div><div class="muted">يتم تحميل بنك الأسئلة محليًا داخل التطبيق. بعد أول تشغيل يمكنك إضافته إلى الشاشة الرئيسية في iPhone.</div></div></div>
<script>window.__CISM_PAYLOAD__=[];</script>
<script src="./payload-00.js"></script><script src="./payload-01.js"></script><script src="./payload-02.js"></script><script src="./payload-03.js"></script><script src="./payload-04.js"></script><script src="./payload-05.js"></script><script src="./payload-06.js"></script><script src="./payload-07.js"></script>
<script>
(function(){
  try{
    if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }
    var b64=window.__CISM_PAYLOAD__.join("");
    var raw=atob(b64);
    var bin=new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++) bin[i]=raw.charCodeAt(i);
    if(!window.pako) throw new Error('pako لم يتم تحميله');
    function gzipBody(u8){
      var p=10, flg=u8[3];
      if(flg&4){ var xlen=u8[p] | (u8[p+1]<<8); p+=2+xlen; }
      if(flg&8){ while(p<u8.length && u8[p++]!==0){} }
      if(flg&16){ while(p<u8.length && u8[p++]!==0){} }
      if(flg&2){ p+=2; }
      if(p>=u8.length-8) throw new Error('gzip header/trailer invalid');
      return u8.subarray(p,u8.length-8);
    }
    var bytes=window.pako.inflateRaw(gzipBody(bin));
    var html=new TextDecoder('utf-8').decode(bytes);
    if(html.indexOf('<!doctype html>')!==0 && html.indexOf('<!DOCTYPE html>')!==0) throw new Error('payload decode failed');
    document.open(); document.write(html); document.close();
  }catch(e){
    document.body.innerHTML='<div class="boot"><div class="box"><div class="logo">CISM</div><h2>تعذر تشغيل التطبيق</h2><div class="err"><b>جرّب التالي:</b><br>1) تأكد أن الاتصال بالإنترنت يعمل.<br>2) أعد تحميل الصفحة مرة واحدة.<br>3) إذا استمرت المشكلة، أغلق Safari وافتح الرابط من جديد.</div><p class="muted">تم تسجيل الخطأ: '+String(e.message||e)+'</p></div></div>';
    console.error(e);
  }
})();
</script></body></html>
